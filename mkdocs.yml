# m2cloud CLI & agent — documentation site configuration.
#
# Toolchain pins: mkdocs-material==9.7.7 and mkdocs<2 (Material's maintainer
# warns MkDocs 2.0 breaks themes/plugins with no migration path — never let a
# floating dep pick it up). CI's docs-build job and the public repo's Pages
# workflow use the same pins.
#   build:  uvx --with 'mkdocs-material==9.7.7' --with 'mkdocs<2' mkdocs build --strict -f apps/m2-cli/mkdocs.yml
#   serve:  uvx --with 'mkdocs-material==9.7.7' --with 'mkdocs<2' mkdocs serve -f apps/m2-cli/mkdocs.yml
#
# The rendered site publishes to the PUBLIC repo's GitHub Pages
# (https://mt2-saas.github.io/m2cloud-cli/) from a copy of this tree synced by
# the release pipeline's mirror job (release.yml "Mirror release to public
# m2cloud-cli repo"). Docs source lives HERE, next to the code; the public repo
# never receives hand edits.
site_name: m2cloud CLI
site_description: >-
  The m2cloud CLI and agent for Metin2 server owners: install, configure, pair
  with your control plane and run the persistent channel.
site_url: https://mt2-saas.github.io/m2cloud-cli/
repo_url: https://github.com/Mt2-SAAS/m2cloud-cli
repo_name: Mt2-SAAS/m2cloud-cli
edit_uri: ""  # source lives in the private repo; disable the edit pencil
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: teal
      accent: teal

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Install: install.md
  - Configuration: configuration.md
  - Quickstart: quickstart.md
  - Commands: commands.md
  - Command reference: reference.md
  - Security: security.md
  - Command channel: channel.md
  - Running as a service: service.md
  - Development: development.md
